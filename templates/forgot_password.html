<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Legal Case Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 30px;
        }

        h1 {
            text-align: center;
            color: #111827;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-box {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            color: #6b7280;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 15px 0 44px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .send-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .send-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #9ca3af;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 22px;
            }
        }
        /* =========================================================
   FORGOT PASSWORD - PROFESSIONAL UI POLISH
   ========================================================= */

body {
    background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.22), transparent 35%),
        radial-gradient(circle at bottom right, rgba(99, 102, 241, 0.20), transparent 35%),
        linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
}

/* Main wrapper */
.page {
    max-width: 460px;
    padding: 20px;
}

/* Card */
.card {
    padding: 42px 38px;
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.98);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 25px 65px rgba(0, 0, 0, 0.28);
    transition: all 0.25s ease;
}

.card:hover {
    box-shadow: 0 30px 75px rgba(0, 0, 0, 0.32);
}

/* Security icon */
.logo {
    width: 70px;
    height: 70px;
    margin-bottom: 21px;

    background: linear-gradient(135deg, #2563eb, #4f46e5);
    border: 1px solid #bfdbfe;
    border-radius: 19px;

    font-size: 32px;

    box-shadow: 0 10px 24px rgba(37, 99, 235, 0.25);
    transition: all 0.25s ease;
}

.logo:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 28px rgba(37, 99, 235, 0.30);
}

/* Heading */
h1 {
    font-size: 29px;
    font-weight: 800;
    letter-spacing: -0.4px;
    color: #0f172a;
}

.description {
    color: #64748b;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 28px;
}

/* Error */
.error {
    background: linear-gradient(135deg, #fef2f2, #fee2e2);
    color: #b91c1c;
    border: 1px solid #fecaca;
    border-left: 4px solid #dc2626;
    padding: 13px 14px;
    border-radius: 11px;
    margin-bottom: 20px;
    line-height: 1.5;
    box-shadow: 0 4px 12px rgba(220, 38, 38, 0.06);
}

/* Form */
.form-group {
    margin-bottom: 21px;
}

label {
    color: #334155;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
}

.input-box {
    position: relative;
}

.input-icon {
    left: 14px;
    color: #64748b;
    transition: color 0.2s ease;
}

.input-box:focus-within .input-icon {
    color: #2563eb;
}

input {
    height: 52px;
    padding: 0 15px 0 44px;

    border: 1px solid #cbd5e1;
    border-radius: 11px;

    background: #ffffff;
    color: #0f172a;

    transition: all 0.2s ease;
}

input:hover {
    border-color: #94a3b8;
}

input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
    transform: translateY(-1px);
}

input::placeholder {
    color: #94a3b8;
}

/* Send OTP */
.send-btn {
    height: 52px;
    border-radius: 11px;

    background: linear-gradient(135deg, #2563eb, #3b82f6);

    font-size: 15px;
    font-weight: 700;

    box-shadow: 0 8px 18px rgba(37, 99, 235, 0.20);

    transition: all 0.25s ease;
}

.send-btn:hover {
    background: linear-gradient(135deg, #1d4ed8, #2563eb);
    transform: translateY(-2px);
    box-shadow: 0 11px 23px rgba(37, 99, 235, 0.28);
}

.send-btn:active {
    transform: translateY(0);
}

/* Back to login */
.back {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #e2e8f0;
}

.back a {
    color: #2563eb;
    font-weight: 700;
    transition: all 0.2s ease;
}

.back a:hover {
    color: #1d4ed8;
    text-decoration: none;
}

/* Footer */
.footer {
    margin-top: 22px;
    color: #94a3b8;
    font-size: 11px;
}

/* Mobile */
@media (max-width: 480px) {

    body {
        padding: 12px;
    }

    .page {
        padding: 10px;
    }

    .card {
        padding: 32px 22px;
        border-radius: 17px;
    }

    .logo {
        width: 62px;
        height: 62px;
        font-size: 29px;
        border-radius: 16px;
    }

    h1 {
        font-size: 25px;
    }

    .description {
        font-size: 13px;
    }

    input,
    .send-btn {
        height: 50px;
    }
}
    </style>
</head>

<body>

<div class="page">

    <div class="card">

        <div class="logo">
            🔐
        </div>

        <h1>Forgot Password?</h1>

        <p class="description">
            Enter your registered email address and we'll help you
            reset your password securely.
        </p>

        {% if error %}
            <div class="error">
                ⚠️ {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('forgot_password') }}">

            <div class="form-group">

                <label for="email">Email Address</label>

                <div class="input-box">

                    <span class="input-icon">✉️</span>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        required
                    >

                </div>

            </div>

            <button type="submit" class="send-btn">
                Send OTP
            </button>

        </form>

        <div class="back">
            <a href="{{ url_for('login') }}">
                ← Back to Login
            </a>
        </div>

        <div class="footer">
            AI Legal Case Management System
        </div>

    </div>

</div>

</body>
</html>
