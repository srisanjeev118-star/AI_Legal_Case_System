<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>2FA Verification | Legal Case Management</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a
            );
        }

        .container {
            width: 420px;
            max-width: 92%;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #e0ecff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
        }

        h2 {
            text-align: center;
            color: #111827;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 22px;
            text-align: center;
            letter-spacing: 8px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }
        /* =========================================================
   2FA VERIFICATION - PROFESSIONAL UI POLISH
   ========================================================= */

body {
    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(59, 130, 246, 0.22),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(99, 102, 241, 0.20),
            transparent 35%
        ),
        linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
}

/* Main card */
.container {
    width: 100%;
    max-width: 440px;
    padding: 42px 38px;

    background: rgba(255, 255, 255, 0.98);

    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: 22px;

    box-shadow: 0 25px 65px rgba(0, 0, 0, 0.28);

    transition: all 0.25s ease;
}

.container:hover {
    transform: translateY(-2px);
    box-shadow: 0 30px 75px rgba(0, 0, 0, 0.32);
}

/* Security icon */
.icon {
    width: 72px;
    height: 72px;

    margin: 0 auto 21px;

    background: linear-gradient(135deg, #dbeafe, #eef2ff);

    border: 1px solid #bfdbfe;
    border-radius: 20px;

    font-size: 33px;

    box-shadow: 0 10px 24px rgba(37, 99, 235, 0.12);

    transition: all 0.25s ease;
}

.icon:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 28px rgba(37, 99, 235, 0.18);
}

/* Heading */
h2 {
    font-size: 27px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -0.3px;
}

.subtitle {
    color: #64748b;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 27px;
}

/* Error */
.error {
    background: linear-gradient(135deg, #fef2f2, #fee2e2);
    color: #b91c1c;

    border: 1px solid #fecaca;
    border-left: 4px solid #dc2626;

    padding: 13px;
    border-radius: 10px;

    margin-bottom: 20px;

    line-height: 1.5;

    box-shadow: 0 4px 12px rgba(220, 38, 38, 0.06);
}

/* Label */
label {
    color: #334155;
    font-size: 13px;
    font-weight: 700;
}

/* OTP input */
input {
    height: 56px;

    padding: 0 14px;

    border: 1px solid #cbd5e1;
    border-radius: 11px;

    background: #ffffff;
    color: #0f172a;

    font-size: 23px;
    font-weight: 700;

    letter-spacing: 10px;

    transition: all 0.2s ease;
}

input:hover {
    border-color: #94a3b8;
}

input:focus {
    border-color: #2563eb;

    box-shadow:
        0 0 0 4px rgba(37, 99, 235, 0.10);

    transform: translateY(-1px);
}

input::placeholder {
    color: #cbd5e1;
}

/* Verify button */
button {
    margin-top: 21px;

    height: 52px;

    border-radius: 11px;

    background: linear-gradient(
        135deg,
        #2563eb,
        #3b82f6
    );

    font-size: 15px;
    font-weight: 700;

    box-shadow:
        0 8px 18px rgba(37, 99, 235, 0.20);

    transition: all 0.25s ease;
}

button:hover {
    background: linear-gradient(
        135deg,
        #1d4ed8,
        #2563eb
    );

    transform: translateY(-2px);

    box-shadow:
        0 11px 23px rgba(37, 99, 235, 0.28);
}

button:active {
    transform: translateY(0);
}

/* Back to Login */
.back {
    margin-top: 23px;
    padding-top: 20px;

    border-top: 1px solid #e2e8f0;

    color: #2563eb;
    font-weight: 700;

    transition: color 0.2s ease;
}

.back:hover {
    color: #1d4ed8;
}

/* Mobile */
@media (max-width: 480px) {

    body {
        padding: 12px;
    }

    .container {
        max-width: 100%;
        padding: 32px 22px;
        border-radius: 17px;
    }

    .icon {
        width: 62px;
        height: 62px;
        font-size: 29px;
        border-radius: 17px;
    }

    h2 {
        font-size: 24px;
    }

    .subtitle {
        font-size: 13px;
    }

    input {
        height: 52px;
        font-size: 21px;
        letter-spacing: 8px;
    }

    button {
        height: 50px;
    }
}

    </style>

</head>

<body>

    <div class="container">

        <div class="icon">
            🔐
        </div>

        <h2>Two-Factor Authentication</h2>

        <p class="subtitle">
            A 6-digit verification OTP has been sent
            to your registered email address.
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <label for="otp">
                Enter OTP
            </label>

            <input
                type="text"
                id="otp"
                name="otp"
                maxlength="6"
                minlength="6"
                pattern="[0-9]{6}"
                inputmode="numeric"
                autocomplete="one-time-code"
                placeholder="••••••"
                required
            >

            <button type="submit">
                Verify & Login
            </button>

        </form>

        <a href="{{ url_for('login') }}" class="back">
            ← Back to Login
        </a>

    </div>

</body>
</html>
