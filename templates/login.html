<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Legal Case Management - Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a
            );

            padding: 20px;
        }


        /* LOGIN BOX */

        .login-box {
            width: 100%;
            max-width: 400px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.25);
        }


        /* TITLE */

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            color: #0f172a;

            font-size: 25px;

            margin-bottom: 8px;
        }

        .title p {
            color: #64748b;

            font-size: 14px;
        }


        /* ERROR */

        .error {
            background: #fee2e2;

            color: #b91c1c;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 14px;

            border: 1px solid #fecaca;
        }


        /* FORM */

        label {
            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-weight: bold;

            font-size: 14px;
        }


        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }


        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10);
        }


        /* FORGOT PASSWORD */

        .forgot-password {
            text-align: right;

            margin-top: -8px;

            margin-bottom: 18px;

            font-size: 13px;
        }


        .forgot-password a {
            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }


        .forgot-password a:hover {
            text-decoration: underline;
        }


        /* LOGIN BUTTON */

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        button:hover {
            background: #1d4ed8;

            transform: translateY(-1px);
        }


        /* REGISTER LINK */

        .register-link {
            text-align: center;

            margin-top: 18px;

            color: #64748b;

            font-size: 14px;
        }


        .register-link a {
            color: #2563eb;

            text-decoration: none;

            font-weight: bold;

            margin-left: 4px;
        }


        .register-link a:hover {
            text-decoration: underline;
        }


        /* FOOTER */

        .footer {
            text-align: center;

            margin-top: 20px;

            padding-top: 18px;

            border-top: 1px solid #e2e8f0;

            color: #64748b;

            font-size: 13px;
        }


        /* MOBILE */

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .login-box {
                padding: 25px 20px;
            }

            .title h1 {
                font-size: 22px;
            }

        }
        /* =========================================================
   LOGIN PAGE - PROFESSIONAL UI POLISH
   ========================================================= */

body {
    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(59, 130, 246, 0.22),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(99, 102, 241, 0.20),
            transparent 35%
        ),
        linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
}

/* Login Card */
.login-box {
    max-width: 430px;
    padding: 42px 38px;

    background: rgba(255, 255, 255, 0.98);

    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: 22px;

    box-shadow: 0 25px 65px rgba(0, 0, 0, 0.28);

    transition: all 0.25s ease;
}

.login-box:hover {
    transform: translateY(-2px);
    box-shadow: 0 30px 75px rgba(0, 0, 0, 0.32);
}

/* Title */
.title {
    margin-bottom: 30px;
}

.title h1 {
    font-size: 28px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -0.3px;
}

.title p {
    color: #64748b;
    font-size: 14px;
    line-height: 1.6;
}

/* Error */
.error {
    background: linear-gradient(135deg, #fef2f2, #fee2e2);
    color: #b91c1c;

    border: 1px solid #fecaca;
    border-left: 4px solid #dc2626;

    padding: 13px 14px;
    border-radius: 10px;

    margin-bottom: 20px;

    line-height: 1.5;

    box-shadow: 0 4px 12px rgba(220, 38, 38, 0.06);
}

/* Labels */
label {
    color: #334155;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
}

/* Inputs */
input {
    padding: 13px 14px;

    border: 1px solid #cbd5e1;
    border-radius: 10px;

    background: #ffffff;
    color: #0f172a;

    font-size: 14px;

    margin-bottom: 20px;

    transition: all 0.2s ease;
}

input:hover {
    border-color: #94a3b8;
}

input:focus {
    border-color: #2563eb;

    box-shadow:
        0 0 0 4px rgba(37, 99, 235, 0.10);

    transform: translateY(-1px);
}

input::placeholder {
    color: #94a3b8;
}

/* Forgot Password */
.forgot-password {
    margin-top: -8px;
    margin-bottom: 20px;
}

.forgot-password a {
    color: #2563eb;
    font-weight: 700;

    transition: color 0.2s ease;
}

.forgot-password a:hover {
    color: #1d4ed8;
    text-decoration: underline;
}

/* Login Button */
button {
    padding: 14px;

    border-radius: 10px;

    background: linear-gradient(
        135deg,
        #2563eb,
        #3b82f6
    );

    font-size: 15px;
    font-weight: 700;

    box-shadow:
        0 8px 18px rgba(37, 99, 235, 0.20);

    transition: all 0.25s ease;
}

button:hover {
    background: linear-gradient(
        135deg,
        #1d4ed8,
        #2563eb
    );

    transform: translateY(-2px);

    box-shadow:
        0 11px 23px rgba(37, 99, 235, 0.28);
}

button:active {
    transform: translateY(0);
}

/* Register */
.register-link {
    margin-top: 24px;
    padding-top: 20px;

    border-top: 1px solid #e2e8f0;

    color: #64748b;
    font-size: 14px;
}

.register-link a {
    color: #2563eb;
    font-weight: 700;

    transition: color 0.2s ease;
}

.register-link a:hover {
    color: #1d4ed8;
    text-decoration: underline;
}

/* Footer */
.footer {
    margin-top: 22px;
    padding-top: 18px;

    border-top: 1px solid #e2e8f0;

    color: #94a3b8;
    font-size: 12px;
}

/* Mobile */
@media (max-width: 500px) {

    body {
        padding: 12px;
    }

    .login-box {
        padding: 32px 22px;
        border-radius: 17px;
    }

    .title h1 {
        font-size: 24px;
    }

    .title p {
        font-size: 13px;
    }

    input,
    button {
        padding: 12px;
    }
}

    </style>

</head>


<body>


<div class="login-box">


    <!-- TITLE -->

    <div class="title">

        <h1>
            ⚖️ Legal Case System
        </h1>

        <p>
            AI Legal Case Management System
        </p>

    </div>


    <!-- ERROR MESSAGE -->

    {% if error %}

        <div class="error">

            ❌ {{ error }}

        </div>

    {% endif %}


    <!-- LOGIN FORM -->

    <form method="POST"
          action="{{ url_for('login') }}">


        <!-- EMAIL -->

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >


        <!-- PASSWORD -->

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >


        <!-- FORGOT PASSWORD -->

        <div class="forgot-password">

            <a href="{{ url_for('forgot_password') }}">
                Forgot Password?
            </a>

        </div>


        <!-- LOGIN -->

        <button type="submit">
            Login
        </button>


    </form>


    <!-- REGISTER -->

    <div class="register-link">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Create Account
        </a>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        Legal Case Management System © 2026

    </div>


</div>


</body>

</html>
