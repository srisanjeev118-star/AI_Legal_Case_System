<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verify OTP | Legal Case Management</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(34, 197, 94, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(59, 130, 246, 0.20),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #0f172a 0%,
                    #1e3a8a 100%
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        /* =====================================================
           MAIN CARD
           ===================================================== */

        .page {
            width: 100%;
            max-width: 430px;
        }

        .card {
            width: 100%;

            background: rgba(255, 255, 255, 0.98);

            padding: 42px 38px;

            border-radius: 22px;

            border: 1px solid rgba(255, 255, 255, 0.55);

            box-shadow:
                0 25px 65px rgba(0, 0, 0, 0.28);

            transition: all 0.25s ease;
        }

        .card:hover {
            transform: translateY(-2px);

            box-shadow:
                0 30px 75px rgba(0, 0, 0, 0.32);
        }


        /* =====================================================
           OTP ICON
           ===================================================== */

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 21px;

            background:
                linear-gradient(
                    135deg,
                    #16a34a,
                    #15803d
                );

            border: 1px solid #86efac;

            border-radius: 19px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            font-size: 32px;

            box-shadow:
                0 10px 24px rgba(22, 163, 74, 0.22);

            transition: all 0.25s ease;
        }

        .logo:hover {
            transform: translateY(-3px);

            box-shadow:
                0 14px 28px rgba(22, 163, 74, 0.28);
        }


        /* =====================================================
           HEADING
           ===================================================== */

        h1 {
            text-align: center;

            color: #0f172a;

            font-size: 29px;

            font-weight: 800;

            letter-spacing: -0.4px;

            margin-bottom: 10px;
        }

        .description {
            text-align: center;

            color: #64748b;

            font-size: 14px;

            line-height: 1.7;

            margin-bottom: 28px;
        }


        /* =====================================================
           ERROR
           ===================================================== */

        .error {
            background:
                linear-gradient(
                    135deg,
                    #fef2f2,
                    #fee2e2
                );

            color: #b91c1c;

            border: 1px solid #fecaca;

            border-left: 4px solid #dc2626;

            padding: 13px 14px;

            border-radius: 11px;

            margin-bottom: 20px;

            font-size: 14px;

            line-height: 1.5;

            box-shadow:
                0 4px 12px rgba(220, 38, 38, 0.06);
        }


        /* =====================================================
           FORM
           ===================================================== */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            color: #334155;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 8px;
        }

        .input-box {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 18px;

            color: #64748b;

            z-index: 2;
        }


        /* =====================================================
           OTP INPUT
           ===================================================== */

        input {
            width: 100%;

            height: 58px;

            padding: 0 14px 0 48px;

            border: 1px solid #cbd5e1;

            border-radius: 11px;

            background: #ffffff;

            color: #0f172a;

            font-size: 23px;

            font-weight: 700;

            letter-spacing: 9px;

            text-align: center;

            outline: none;

            transition: all 0.2s ease;
        }

        input:hover {
            border-color: #94a3b8;
        }

        input:focus {
            border-color: #16a34a;

            box-shadow:
                0 0 0 4px rgba(22, 163, 74, 0.10);

            transform: translateY(-1px);
        }

        input::placeholder {
            color: #94a3b8;

            font-size: 13px;

            letter-spacing: normal;

            font-weight: 400;
        }


        /* =====================================================
           VERIFY BUTTON
           ===================================================== */

        .verify-btn {
            width: 100%;

            height: 52px;

            margin-top: 1px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #16a34a,
                    #15803d
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 8px 18px rgba(22, 163, 74, 0.20);

            transition: all 0.25s ease;
        }

        .verify-btn:hover {
            background:
                linear-gradient(
                    135deg,
                    #15803d,
                    #166534
                );

            transform: translateY(-2px);

            box-shadow:
                0 11px 23px rgba(22, 163, 74, 0.28);
        }

        .verify-btn:active {
            transform: translateY(0);
        }


        /* =====================================================
           OTP INFORMATION
           ===================================================== */

        .info {
            text-align: center;

            margin-top: 20px;

            padding: 14px;

            background:
                linear-gradient(
                    135deg,
                    #f0fdf4,
                    #ecfdf5
                );

            border: 1px solid #bbf7d0;

            border-left: 4px solid #16a34a;

            border-radius: 11px;

            color: #166534;

            font-size: 12px;

            line-height: 1.5;

            box-shadow:
                0 4px 12px rgba(22, 163, 74, 0.05);
        }


        /* =====================================================
           BACK LINK
           ===================================================== */

        .back {
            text-align: center;

            margin-top: 23px;

            padding-top: 20px;

            border-top: 1px solid #e2e8f0;
        }

        .back a {
            color: #2563eb;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            transition: color 0.2s ease;
        }

        .back a:hover {
            color: #1d4ed8;

            text-decoration: underline;
        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .footer {
            text-align: center;

            margin-top: 22px;

            color: #94a3b8;

            font-size: 11px;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 480px) {

            body {
                padding: 12px;
            }

            .page {
                padding: 10px;
            }

            .card {
                padding: 32px 22px;

                border-radius: 17px;
            }

            .logo {
                width: 62px;
                height: 62px;

                font-size: 29px;

                border-radius: 16px;
            }

            h1 {
                font-size: 25px;
            }

            .description {
                font-size: 13px;
            }

            input {
                height: 53px;

                font-size: 21px;

                letter-spacing: 8px;
            }

            .verify-btn {
                height: 50px;
            }
        }

    </style>

</head>


<body>


<div class="page">

    <div class="card">


        <!-- OTP ICON -->

        <div class="logo">
            🔑
        </div>


        <!-- TITLE -->

        <h1>
            Verify OTP
        </h1>


        <p class="description">
            Enter the 6-digit OTP generated for your account
            to continue resetting your password.
        </p>


        <!-- ERROR -->

        {% if error %}

            <div class="error">
                ⚠️ {{ error }}
            </div>

        {% endif %}


        <!-- OTP FORM -->

        <form
            method="POST"
            action="{{ url_for('verify_reset_otp') }}"
        >

            <div class="form-group">

                <label for="otp">
                    Verification Code
                </label>


                <div class="input-box">

                    <span class="input-icon">
                        🔢
                    </span>


                    <input
                        type="text"
                        id="otp"
                        name="otp"
                        maxlength="6"
                        minlength="6"
                        pattern="[0-9]{6}"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        placeholder="Enter OTP"
                        required
                    >

                </div>

            </div>


            <!-- VERIFY -->

            <button
                type="submit"
                class="verify-btn"
            >
                Verify OTP
            </button>

        </form>


        <!-- OTP VALIDITY -->

        <div class="info">
            ⏱️ OTP is valid for 5 minutes.
        </div>


        <!-- CHANGE EMAIL -->

        <div class="back">

            <a href="{{ url_for('forgot_password') }}">
                ← Change Email
            </a>

        </div>


        <!-- FOOTER -->

        <div class="footer">
            AI Legal Case Management System
        </div>


    </div>

</div>


</body>

</html>
