<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Legal Case Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #7c3aed, #5b21b6);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 30px;
        }

        h1 {
            text-align: center;
            color: #111827;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-box {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 45px 0 44px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
        }

        .toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6b7280;
            font-size: 17px;
        }

        .reset-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #7c3aed, #5b21b6);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }

        .reset-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.25);
        }

        .password-note {
            margin-top: 18px;
            padding: 12px;
            background: #f5f3ff;
            border-radius: 9px;
            color: #6b7280;
            font-size: 12px;
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #9ca3af;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 22px;
            }
        }
        /* =========================================================
   RESET PASSWORD - PROFESSIONAL UI POLISH
   ========================================================= */

body {
    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(124, 58, 237, 0.22),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(59, 130, 246, 0.18),
            transparent 35%
        ),
        linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
}

/* Card */
.card {
    padding: 42px 38px;
    border-radius: 22px;
    border: 1px solid rgba(255,255,255,.5);
    box-shadow: 0 25px 65px rgba(0,0,0,.28);
    transition: all .25s ease;
}

.card:hover {
    transform: translateY(-2px);
    box-shadow: 0 30px 75px rgba(0,0,0,.32);
}

/* Security icon */
.logo {
    width: 70px;
    height: 70px;
    margin-bottom: 21px;

    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    border: 1px solid #ddd6fe;
    border-radius: 19px;

    font-size: 32px;

    box-shadow: 0 10px 24px rgba(124,58,237,.25);
    transition: all .25s ease;
}

.logo:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 28px rgba(124,58,237,.30);
}

/* Heading */
h1 {
    font-size: 29px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -.4px;
}

.description {
    color: #64748b;
    font-size: 14px;
    line-height: 1.7;
}

/* Error */
.error {
    background: linear-gradient(135deg, #fef2f2, #fee2e2);
    color: #b91c1c;
    border: 1px solid #fecaca;
    border-left: 4px solid #dc2626;
    border-radius: 11px;
    padding: 13px 14px;
    line-height: 1.5;
    box-shadow: 0 4px 12px rgba(220,38,38,.06);
}

/* Labels */
label {
    color: #334155;
    font-size: 13px;
    font-weight: 700;
}

/* Inputs */
input {
    height: 52px;
    border: 1px solid #cbd5e1;
    border-radius: 11px;
    background: #fff;
    color: #0f172a;
    transition: all .2s ease;
}

input:hover {
    border-color: #94a3b8;
}

input:focus {
    border-color: #7c3aed;
    box-shadow: 0 0 0 4px rgba(124,58,237,.10);
    transform: translateY(-1px);
}

input::placeholder {
    color: #94a3b8;
}

/* Icons */
.input-icon {
    color: #64748b;
}

.input-box:focus-within .input-icon {
    color: #7c3aed;
}

/* Password toggle */
.toggle {
    color: #64748b;
    transition: all .2s ease;
    user-select: none;
}

.toggle:hover {
    color: #7c3aed;
    transform: translateY(-50%) scale(1.08);
}

/* Reset button */
.reset-btn {
    height: 52px;
    margin-top: 8px;
    border-radius: 11px;

    background: linear-gradient(135deg, #7c3aed, #6366f1);

    font-weight: 700;

    box-shadow: 0 8px 18px rgba(124,58,237,.20);

    transition: all .25s ease;
}

.reset-btn:hover {
    background: linear-gradient(135deg, #6d28d9, #4f46e5);
    transform: translateY(-2px);
    box-shadow: 0 11px 23px rgba(124,58,237,.28);
}

.reset-btn:active {
    transform: translateY(0);
}

/* Password requirement */
.password-note {
    margin-top: 20px;
    padding: 14px;

    background: linear-gradient(135deg, #f5f3ff, #eef2ff);

    border: 1px solid #ddd6fe;
    border-left: 4px solid #7c3aed;

    border-radius: 11px;

    color: #64748b;
    line-height: 1.6;

    box-shadow: 0 4px 12px rgba(124,58,237,.05);
}

.password-note::first-line {
    color: #475569;
}

/* Footer */
.footer {
    margin-top: 22px;
    color: #94a3b8;
    font-size: 11px;
}

/* Mobile */
@media (max-width: 480px) {

    body {
        padding: 12px;
    }

    .page {
        padding: 10px;
    }

    .card {
        padding: 32px 22px;
        border-radius: 17px;
    }

    .logo {
        width: 62px;
        height: 62px;
        font-size: 29px;
        border-radius: 16px;
    }

    h1 {
        font-size: 25px;
    }

    .description {
        font-size: 13px;
    }

    input,
    .reset-btn {
        height: 50px;
    }
}
    </style>
</head>

<body>

<div class="page">

    <div class="card">

        <div class="logo">
            🔒
        </div>

        <h1>Reset Password</h1>

        <p class="description">
            Create a new secure password for your
            Legal Case Management account.
        </p>

        {% if error %}
            <div class="error">
                ⚠️ {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('reset_password') }}">

            <div class="form-group">

                <label for="password">New Password</label>

                <div class="input-box">

                    <span class="input-icon">🔑</span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter new password"
                        minlength="6"
                        required
                    >

                    <span class="toggle"
                          onclick="togglePassword('password', this)">
                        👁️
                    </span>

                </div>

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <div class="input-box">

                    <span class="input-icon">🔐</span>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        minlength="6"
                        required
                    >

                    <span class="toggle"
                          onclick="togglePassword('confirm_password', this)">
                        👁️
                    </span>

                </div>

            </div>


            <button type="submit" class="reset-btn">
                Reset Password
            </button>

        </form>


        <div class="password-note">
            🔐 Password must contain at least 6 characters.
        </div>


        <div class="footer">
            AI Legal Case Management System
        </div>

    </div>

</div>


<script>

function togglePassword(id, icon) {

    const input = document.getElementById(id);

    if (input.type === "password") {
        input.type = "text";
        icon.textContent = "🙈";
    } else {
        input.type = "password";
        icon.textContent = "👁️";
    }

}

</script>

</body>
</html>
